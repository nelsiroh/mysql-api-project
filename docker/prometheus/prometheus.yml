global:
  scrape_interval: 15s
  evaluation_interval: 15s

  external_labels:
    cluster: local-docker
    environment: local

remote_write:
  - url: http://mimir:9009/api/v1/push

scrape_configs:
  # Scrape metrics exported by the OpenTelemetry Collector
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]

  # Mimir's own operational metrics
  - job_name: local/mimir
    metrics_path: /metrics
    static_configs:
      - targets:
          - mimir:9009
        labels:
          namespace: local
          pod: mimir-1
