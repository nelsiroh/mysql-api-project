services:
  db:
    image: mysql:8.4.8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpasswd
      MYSQL_DATABASE: coffeedb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: appuserpasswd
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpasswd"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ../app/backend
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: appuserpasswd
      DB_NAME: coffeedb

      # OpenTelemetry (OTLP over HTTP/protobuf)
      OTEL_SERVICE_NAME: coffee-api
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      DEPLOY_ENV: local
      SERVICE_VERSION: dev
    ports:
      - "8080:8080"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    platform: linux/amd64
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpasswd
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.147.0
    user: "0:0"
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./otel/config.yml:/etc/otelcol/config.yml:ro
      - otel_data:/var/lib/otelcol
    ports:
      - "4318:4318"
      - "8889:8889"
    depends_on:
      tempo:
        condition: service_started
      prometheus:
        condition: service_started

  tempo:
    image: grafana/tempo:2.10.1
    user: "0:0"
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"

  prometheus:
    image: prom/prometheus:v3.5.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      mimir:
        condition: service_started

  mimir:
    image: grafana/mimir:2.17.1
    user: "0:0"
    command: ["-config.file=/etc/mimir/config.yml"]
    volumes:
      - ./mimir/config.yml:/etc/mimir/config.yml:ro
      - mimir_data:/data/mimir
    ports:
      - "9009:9009"

  loki:
    image: grafana/loki:3.6.7
    #profiles: ["loki"]
    user: "0:0"
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/tmp/loki
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.16.0
    #profiles: ["loki"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:12.4.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      mimir:
        condition: service_started
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      # loki:
      #   condition: service_started

volumes:
  db_data:
    name: mysql_api_project_db_data
  grafana_data:
    name: mysql_api_project_grafana_data
  otel_data:
    name: mysql_api_project_otel_data
  tempo_data:
    name: mysql_api_project_tempo_data
  mimir_data:
    name: mysql_api_project_mimir_data
  loki_data:
    name: mysql_api_project_loki_data
  alloy_data:
    name: mysql_api_project_alloy_data
